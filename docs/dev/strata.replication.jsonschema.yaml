# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
$schema: "http://json-schema.org/draft-07/schema#"
title: strata.replication prompt frontmatter
description: >
  Files in strata.replication.kb/ are the run's conversation turns,
  numbered in send order: each one's operator note, and a pointer to
  the send-ready text in instructions.d/. The frontmatter says which
  original-session turns this one distills and whether the blind is
  still on when it is sent.
type: object
additionalProperties: false
required:
  - origin
  - blind
properties:
  origin:
    description: >
      Provenance -- the original-session turns this one distills, as
      `<session-prefix>:<line>` refs into the JSONL under
      ~/.claude/projects/. Empty for turns the original run never had.
    type: array
    items:
      type: string
      pattern: "^[0-9a-f]{8}:\\d+$"
  blind:
    description: >
      Whether the existing answer is still hidden from the agent when
      this turn is sent. Exactly one file flips it to false.
    type: boolean
