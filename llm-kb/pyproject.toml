[project]
name = "llm-kb"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.23",
  "referencing>=0.35",
]

[project.scripts]
"llm.kb-validate" = "llmd.frontmatter_validate:main"

[dependency-groups]
dev = [
  "pytest>=8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib/python/llmd"]
