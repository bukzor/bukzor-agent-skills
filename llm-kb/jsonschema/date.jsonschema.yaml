# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
$id: "skill://llm-kb/jsonschema/date.jsonschema.yaml"
$schema: "skill://llm-kb/jsonschema/dialect.jsonschema.yaml"
title: a calendar day
description: >
  What yaml.safe_load returns for an unquoted ISO-8601 date --
  `last-updated: 2026-08-21` -- a datetime.date. Quoting it makes it a
  string and fails here; a timestamp is an `instant`, not a date.

  $ref this rather than writing `type: date` inline: the extension type
  obliges its schema to declare the llmd dialect, and this file is where
  that declaration lives once. A $ref crossing re-selects the dialect
  from the resource it lands in, so a consumer needs no $schema of its
  own.
type: date
