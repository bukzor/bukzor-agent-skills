title: triggers field
description: |
  The one frontmatter directive: a list of (condition, read) pairs. A
  juncture key -- `before:`, `when:`, `after:` -- names the condition;
  omit it and the entry inherits its carrier's. `read:` names what to
  load, one target or several. Grammar: Skill(llm-triggers),
  `design.kb/040-design.kb/triggers-field.md`.

type: array
minItems: 1
items:
  type: object
  required: [read]
  additionalProperties: false
  # one juncture at most, alongside `read:`
  maxProperties: 2
  properties:
    before: {type: string}
    when: {type: string}
    after: {type: string}
    read:
      oneOf:
        - type: string
        - type: array
          minItems: 1
          items: {type: string}
