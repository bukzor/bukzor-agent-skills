# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
$id: "skill://llm-kb/jsonschema/instant.jsonschema.yaml"
$schema: "skill://llm-kb/jsonschema/dialect.jsonschema.yaml"
title: a point in time, with an offset
description: >
  What yaml.safe_load returns for an unquoted ISO-8601 timestamp
  carrying an offset -- `sent: 2026-08-10T20:36:30.502Z` -- a tz-aware
  datetime.datetime. Quoting it makes it a string and fails here; a
  naive timestamp names no moment and fails too, so pick an offset.

  $ref this rather than writing `type: instant` inline: the extension
  type obliges its schema to declare the llmd dialect, and this file is
  where that declaration lives once. A $ref crossing re-selects the
  dialect from the resource it lands in, so a consumer needs no $schema
  of its own.
type: instant
