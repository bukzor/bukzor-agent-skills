# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
description: Schema for food items in food.kb/
type: object
additionalProperties: false
required:
  - status
  - budget
properties:
  status:
    $ref: "jsonschema/status.jsonschema.yaml"
  budget:
