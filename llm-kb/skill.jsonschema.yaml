$schema: "skill://llm-kb/jsonschema/dialect.jsonschema.yaml"
title: skill.kb member frontmatter
description: |
  Frontmatter for files directly in skill.kb/ -- each a summary of a
  sibling .kb/ (self-audit.md over self-audit.kb/), so each carries the
  date it was last derived from one.

type: object
required:
  - last-updated

properties:
  last-updated:
    type: date
    description: ISO date this file was last refreshed.

additionalProperties: false
