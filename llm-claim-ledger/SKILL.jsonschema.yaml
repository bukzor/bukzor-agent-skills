# yaml-language-server: $schema=https://json-schema.org/draft-07/schema
$schema: "http://json-schema.org/draft-07/schema#"
title: SKILL.kb/ entry frontmatter
description: >
  Rules for using the ledger, one per file. Body states the rule;
  frontmatter carries its ledger label and standing — this skill
  governed by itself.
type: object
additionalProperties: false
required:
  - label
  - standing
properties:
  label:
    description: Stable ledger label — greppable, unique within the skill
    type: string
    pattern: "^[A-Z]{2,5}$"
  standing:
    description: >-
      The sigil, spelled out: asserted (bare) | open (?) |
      fiat (+, agent-settled, revocable on sight) | warranted (!)
    type: string
    enum: [asserted, open, fiat, warranted]
