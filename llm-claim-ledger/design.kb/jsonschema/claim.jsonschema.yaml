# yaml-language-server: $schema=https://json-schema.org/draft-07/schema
$schema: "http://json-schema.org/draft-07/schema#"
title: design-ledger claim frontmatter
description: >
  One claim per file. The body states the claim and its reasons;
  frontmatter carries the ledger label and the standing. Shared by every
  theory in design.kb/ — the theories differ in ontology, not in shape.
type: object
additionalProperties: false
required:
  - label
  - standing
properties:
  label:
    description: >-
      Stable ledger label — names the locus of contention, not the
      current conclusion, so it survives revision
    type: string
    pattern: "^[A-Z]{2,5}$"
  standing:
    description: >-
      The sigil, spelled out: asserted (bare) | open (?) |
      fiat (+, agent-settled, revocable on sight) | warranted (!)
    type: string
    enum: [asserted, open, fiat, warranted]
