# yaml-language-server: $schema=https://json-schema.org/draft-07/schema
$schema: "http://json-schema.org/draft-07/schema#"
title: design.kb/ synthesis-file frontmatter
description: |
  Frontmatter for synthesis files directly in design.kb/ (e.g.
  good-smells.md) that roll up a sibling .kb/ collection.

type: object
required:
  - last-updated

properties:
  last-updated:
    type: string
    pattern: '^\d{4}-\d{2}-\d{2}$'
    description: ISO date this file was last refreshed.

additionalProperties: false
