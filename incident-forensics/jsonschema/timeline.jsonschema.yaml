# yaml-language-server: $schema=https://json-schema.org/draft-07/schema
$schema: "skill://llm-kb/jsonschema/dialect.jsonschema.yaml"
title: Timeline Event Metadata
type: object
properties:
  at:
    type: instant
    description: When the event happened; an unquoted ISO 8601 timestamp with a UTC offset (local preferred). For a span, the start.
  source:
    type: string
    description: Where the time was read from (log line, file mtime, user report).
  confidence:
    type: string
    enum: [observed, inferred]
required: [at, source, confidence]
additionalProperties: false
