[project]
name = "llm-claims-kb"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "pyyaml>=6.0",
]

[project.scripts]
llm-claims-kb-ownership = "llm_claims_kb.ownership:main"
llm-claims-kb-dot = "llm_claims_kb.dot:main"
llm-claims-kb-flatten = "llm_claims_kb.flatten:main"
llm-claims-kb-mentions = "llm_claims_kb.mentions:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib/python/llm_claims_kb"]
