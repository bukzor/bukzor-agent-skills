# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
$schema: https://json-schema.org/draft/2020-12/schema
description: >
  Open inquiries that structure investigation. The entry point
  for collaborative knowledge-building.
$defs:
  base:
    $anchor: base
    description: |
      The extensible base: everything but the closure. Consumers that add
      fields $ref this anchor and close themselves with
      `unevaluatedProperties: false`; exact-conformance consumers $ref the
      document root, which is this base plus closure.
    type: object
    properties:
      resolved:
        description: Path to the claim that answers this question
        type: string
      candidate-resolutions:
        description: Paths to claims being considered as potential answers
        type: array
        items:
          type: string
      sources:
        description: Paths to sources where this question was raised
        type: array
        items:
          type: string
      depends:
        description: Paths to nodes this question depends on for context
        type: array
        items:
          type: string
      tags:
        description: Topic tags for cross-referencing
        type: array
        items:
          type: string
$ref: "#/$defs/base"
unevaluatedProperties: false
