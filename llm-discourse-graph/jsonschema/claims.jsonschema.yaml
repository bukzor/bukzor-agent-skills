# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
$schema: "skill://llm-kb/jsonschema/dialect.jsonschema.yaml"
description: >
  Propositional assertions — the atomic units of the knowledge graph.
  Covers both observations and hypotheses. The body text states the
  claim and any relevant context or caveats.
$defs:
  base:
    $anchor: base
    description: |
      The extensible base: everything but the closure. Consumers that add
      fields $ref this anchor and close themselves with
      `unevaluatedProperties: false`; exact-conformance consumers $ref the
      document root, which is this base plus closure.
    type: object
    required:
      - status
    properties:
      status:
        description: >
          Epistemic standing: whether we believe this claim. Deliberately
          not a place to record that a claim stopped mattering -- that is
          `live`, and conflating them forces a false choice between saying
          a claim is true and saying it is finished.
        type: string
        enum: [asserted, contested, retracted]
      live:
        description: >
          Whether this claim still bears on anything (default true).
          Orthogonal to `status`. A claim that was true and then got acted
          on is `status: asserted, live: false`: retiring it must not
          require calling it wrong. Named as the antonym of `dead` -- as in
          dead code or a dead link, still present, no longer in force,
          never "mistaken".
        default: true
        type: boolean
      superseded-by:
        description: >
          Paths to the nodes that replace this one -- any collection, not
          just claims.kb: a claim is often retired by a goal or a design
          note rather than by another claim. A relation, not a status: a
          link checker can follow it, and it says *which* node won rather
          than dead-ending. A claim can be dead without a
          successor -- the world moved and nothing replaced it -- so `live`
          is the primitive and this is the extra.
        type: array
        items:
          type: string
      likelihood:
        description: How likely this claim is to be true, 0-1 (default 1.0 — certain until told otherwise)
        default: 1.0
        type: number
        minimum: 0
        maximum: 1
      sources:
        description: >
          Paths to sources providing this claim -- empirical provenance, or the
          discussion participant who asserted it (kind user/assistant)
        type: array
        items:
          type: string
      date-observed:
        description: When this was observed or collected, if empirical (ISO 8601)
        type: date  # YAML parses ISO dates (2026-03-10) as date objects; see llm-kb schema-design
      depends:
        description: Paths to nodes this claim depends on for context
        type: array
        items:
          type: string
      tags:
        description: Topic tags for cross-referencing
        type: array
        items:
          type: string
    dependentSchemas:
      superseded-by:
        description: >
          A superseded claim is not live, and storing both without tying
          them lets the two disagree -- the exact defect that got `status`
          removed from ideation.epistemics' fork.
        required: [live]
        properties:
          live:
            const: false
$ref: "#/$defs/base"
unevaluatedProperties: false
